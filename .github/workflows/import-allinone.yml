      - name: Patch Android App (Fix Const.java MAIN URL + strings.xml)
        env:
          RAILWAY_URL: ${{ github.event.inputs.railway_url || 'https://allinone-backend-production.up.railway.app/' }}
        run: |
          case "$RAILWAY_URL" in
            */) ;;
            *) RAILWAY_URL="${RAILWAY_URL}/" ;;
          esac

          # 1. Fix Const.java (uncomment MAIN and set to Railway URL)
          sed -i 's|//    public static final String MAIN = "https://androappstech.in/AllInOneDemo/";|    public static final String MAIN = "'"$RAILWAY_URL"'";|g' android-app/app/src/main/java/com/gamegards/allinonev3/SampleClasses/Const.java

          # 2. Fix strings.xml line 9 syntax error (remove stray "removeLastChars")
          sed -i 's|</string>removeLastChars|</string>|g' android-app/app/src/main/res/values/strings.xml

      - name: Generate Railway Dockerfile, Entrypoint (Auto SQL Import + 5s Cron) & railway.json
        run: |
          cat << 'ENTRY_EOF' > railway-entrypoint.sh
          #!/usr/bin/env bash
          set -e

          PORT_TO_USE="${PORT:-8080}"
          sed -i "s/Listen 80/Listen ${PORT_TO_USE}/g" /etc/apache2/ports.conf
          sed -i "s/<VirtualHost \*:80>/<VirtualHost *:${PORT_TO_USE}>/g" /etc/apache2/sites-available/000-default.conf
          echo "ServerName localhost" >> /etc/apache2/apache2.conf

          export DB_HOST="${MYSQLHOST:-${DB_HOST:-127.0.0.1}}"
          export DB_PORT="${MYSQLPORT:-${DB_PORT:-3306}}"
          export DB_USERNAME="${MYSQLUSER:-${DB_USERNAME:-root}}"
          export DB_PASSWORD="${MYSQLPASSWORD:-${DB_PASSWORD:-}}"
          export DB_NAME="${MYSQLDATABASE:-${DB_NAME:-railway}}"

          if [ -f "/var/www/html/db/AllInOneDemoV3.sql" ]; then
            export MYSQL_PWD="${DB_PASSWORD}"
            for i in $(seq 1 20); do
              if mysql -h"${DB_HOST}" -P"${DB_PORT}" -u"${DB_USERNAME}" "${DB_NAME}" -e "SELECT 1" >/dev/null 2>&1; then
                TABLE_EXISTS=$(mysql -N -s -h"${DB_HOST}" -P"${DB_PORT}" -u"${DB_USERNAME}" "${DB_NAME}" -e "SHOW TABLES LIKE 'tbl_admin';" 2>/dev/null || true)
                if [ -z "$TABLE_EXISTS" ]; then
                  echo "Importing db/AllInOneDemoV3.sql into Railway MySQL..."
                  { echo "SET SESSION sql_mode='';"; cat /var/www/html/db/AllInOneDemoV3.sql; } | mysql -h"${DB_HOST}" -P"${DB_PORT}" -u"${DB_USERNAME}" "${DB_NAME}" || true
                  echo "SQL import finished."
                else
                  echo "Database already initialized (tbl_admin found)."
                fi
                break
              fi
              echo "Waiting for MySQL... ($i/20)"
              sleep 2
            done
            unset MYSQL_PWD
          fi

          (
            while true; do
              php /var/www/html/index.php api cron all >/dev/null 2>&1 || true
              php /var/www/html/index.php api cron cron_draw >/dev/null 2>&1 || true
              php /var/www/html/index.php api cron cron_rummy_draw >/dev/null 2>&1 || true
              sleep 5
            done
          ) &

          exec apache2-foreground
          ENTRY_EOF
          chmod +x railway-entrypoint.sh

          cat << 'DOCKER_EOF' > Dockerfile
          FROM php:7.4-apache

          RUN apt-get update && apt-get install -y \
              default-mysql-client \
              libpng-dev \
              libjpeg-dev \
              libfreetype6-dev \
              libzip-dev \
              unzip \
              curl \
              && docker-php-ext-configure gd --with-freetype --with-jpeg \
              && docker-php-ext-install -j$(nproc) mysqli pdo pdo_mysql gd zip \
              && a2enmod rewrite headers \
              && rm -rf /var/lib/apt/lists/*

          RUN sed -i 's/AllowOverride None/AllowOverride All/g' /etc/apache2/apache2.conf /etc/apache2/sites-available/*.conf \
              && printf "display_errors = Off\nerror_reporting = E_ALL & ~E_NOTICE & ~E_DEPRECATED\n" > /usr/local/etc/php/conf.d/ci3-clean.ini

          WORKDIR /var/www/html
          COPY . /var/www/html/
          COPY railway-entrypoint.sh /usr/local/bin/railway-entrypoint.sh

          RUN mkdir -p /var/www/html/data/post /var/www/html/data/Redeem /var/www/html/data/cards /var/www/html/application/logs /var/www/html/application/cache \
              && chmod -R 777 /var/www/html/data /var/www/html/application/logs /var/www/html/application/cache \
              && chmod +x /usr/local/bin/railway-entrypoint.sh

          EXPOSE 8080
          CMD ["/usr/local/bin/railway-entrypoint.sh"]
          DOCKER_EOF

          cat << 'RAILWAY_EOF' > railway.json
          {
            "$schema": "https://railway.app/railway.schema.json",
            "build": {
              "builder": "DOCKERFILE",
              "dockerfilePath": "Dockerfile"
            },
            "deploy": {
              "restartPolicyType": "ON_FAILURE",
              "restartPolicyMaxRetries": 10
            }
          }
          RAILWAY_EOF

          cat << 'DOCKERIGNORE_EOF' > .dockerignore
          android-app/
          .git/
          .github/
          node_modules/
          DOCKERIGNORE_EOF

      - name: Commit & Push Extracted Backend + Android Project to GitHub Repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "feat: unpack AllInOne V3 PHP Backend + MySQL DB + Native Android App from GDrive"
            git push origin HEAD:${{ github.ref_name }} --force
          fi
