name: Check Teen Patti game API
on:
  workflow_dispatch:
  push:
    paths:
      - 'application/controllers/api/Game.php'
      - 'application/models/Game_model.php'
      - 'tests/teen_patti_round.php'
      - '.github/workflows/patch-game-apis.yml'
permissions:
  contents: read
jobs:
  round-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: php -l application/models/Game_model.php && php -l application/controllers/api/Game.php && php tests/teen_patti_round.php
