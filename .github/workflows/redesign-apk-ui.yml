name: 03 - Redesign Android UI & Build Signed APK

on:
  workflow_dispatch:
    inputs:
      railway_url:
        description: 'Live Railway Backend URL (must end with /)'
        required: true
        default: 'https://allinone-v3-game-production.up.railway.app/'
      app_name:
        description: 'Android App Display Name'
        required: true
        default: 'AllInOne V3 Game'

permissions:
  contents: write

jobs:
  redesign-and-build-apk:
    name: Apply Modern Casino UI & Compile Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate Android Project Directory
        id: locate
        run: |
          if [ -f "android-app/app/build.gradle" ]; then
            echo "dir=android-app" >> $GITHUB_OUTPUT
          elif [ -f "DemoAllinone-master/app/build.gradle" ]; then
            echo "dir=DemoAllinone-master" >> $GITHUB_OUTPUT
          elif [ -f "app/build.gradle" ]; then
            echo "dir=." >> $GITHUB_OUTPUT
          else
            echo "::error::Android project not found!"
            exit 1
          fi

      - name: Install SVG Vector Renderer (librsvg2-bin)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin fonts-dejavu-core

      - name: Apply Midnight Obsidian, Emerald Felt & Gold UI Redesign
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          python3 - << 'PYEOF'
          import os, re, subprocess, xml.etree.ElementTree as ET

          res_dir = 'app/src/main/res'
          drawable_dir = os.path.join(res_dir, 'drawable')
          xxhdpi_dir = os.path.join(res_dir, 'drawable-xxhdpi')
          layout_dir = os.path.join(res_dir, 'layout')
          values_dir = os.path.join(res_dir, 'values')
          java_root = 'app/src/main/java/com/gamegards/allinonev3'

          os.makedirs(drawable_dir, exist_ok=True)
          os.makedirs(xxhdpi_dir, exist_ok=True)

          def write_file(path, content):
              cleaned = re.sub(r'(?m)^          ', '', content).lstrip('\n')
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(cleaned)

          def render_svg(svg_content, out_png, w, h):
              svg_path = out_png + '.svg'
              write_file(svg_path, svg_content)
              subprocess.check_call(['rsvg-convert', '-w', str(w), '-h', str(h), svg_path, '-o', out_png])
              os.remove(svg_path)

          # ------------------------------------------------------------------
          # 1. XML Drawables (Shapes, Layer-Lists, Vectors)
