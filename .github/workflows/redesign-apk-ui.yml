                              android:visibility="visible">

                              <LinearLayout
                                  android:layout_width="wrap_content"
                                  android:layout_height="44dp"
                                  android:layout_gravity="center"
                                  android:gravity="center_vertical"
                                  android:orientation="horizontal">

                                  <ImageView
                                      android:id="@+id/imgpl1pack"
                                      android:layout_width="104dp"
                                      android:layout_height="36dp"
                                      android:layout_gravity="center_vertical"
                                      android:scaleType="fitCenter"
                                      android:src="@drawable/casino_action_pack"
                                      android:visibility="visible" />

                                  <ImageView
                                      android:id="@+id/imgpl1show"
                                      android:layout_width="104dp"
                                      android:layout_height="36dp"
                                      android:layout_gravity="center_vertical"
                                      android:layout_marginLeft="8dp"
                                      android:scaleType="fitCenter"
                                      android:src="@drawable/casino_action_show"
                                      android:visibility="visible" />
                              </LinearLayout>

                              <LinearLayout
                                  android:layout_width="wrap_content"
                                  android:layout_height="44dp"
                                  android:layout_marginLeft="16dp"
                                  android:gravity="center_vertical"
                                  android:orientation="horizontal">

                                  <ImageView
                                      android:id="@+id/imgpl1minus"
                                      android:layout_width="34dp"
                                      android:layout_height="34dp"
                                      android:layout_gravity="center_vertical"
                                      android:scaleType="fitCenter"
                                      android:src="@drawable/casino_stepper_minus"
                                      android:visibility="visible" />

                                  <LinearLayout
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:orientation="vertical">

                                      <Button
                                          android:id="@+id/btnpl1number"
                                          android:layout_width="118dp"
                                          android:layout_height="34dp"
                                          android:layout_gravity="center_vertical"
                                          android:layout_marginLeft="6dp"
                                          android:layout_marginRight="6dp"
                                          android:background="@drawable/casino_btn_gold_outline"
                                          android:padding="0dp"
                                          android:text="CHAAL 50"
                                          android:textColor="#F5D06F"
                                          android:textSize="12sp"
                                          android:textStyle="bold" />
                                  </LinearLayout>

                                  <ImageView
                                      android:id="@+id/imgpl1plus"
                                      android:layout_width="34dp"
                                      android:layout_height="34dp"
                                      android:layout_gravity="center_vertical"
                                      android:scaleType="fitCenter"
                                      android:src="@drawable/casino_stepper_plus"
                                      android:visibility="visible" />
                              </LinearLayout>

                              <TextView
                                  android:id="@+id/imgblind1"
                                  android:layout_width="104dp"
                                  android:layout_height="36dp"
                                  android:layout_gravity="center"
                                  android:layout_marginLeft="16dp"
                                  android:background="@drawable/casino_btn_emerald"
                                  android:elevation="4dp"
                                  android:gravity="center"
                                  android:text="Blind"
                                  android:textColor="#FFFFFF"
                                  android:textSize="15sp"
                                  android:textStyle="bold" />

                              <ImageView
                                  android:id="@+id/imgpl1chaal"
                                  android:layout_width="104dp"
                                  android:layout_height="36dp"
                                  android:layout_marginLeft="8dp"
                                  android:scaleType="fitCenter"
                                  android:src="@drawable/casino_action_chaal"
                                  android:visibility="gone" />
                          </LinearLayout>

                          <ImageView
                              android:id="@+id/imgchat"
                              android:layout_width="34dp"
                              android:layout_height="34dp"
                              android:layout_alignParentRight="true"
                              android:layout_centerVertical="true"
                              android:layout_marginRight="8dp"
                              android:src="@drawable/ic_vec_chat"
                              android:visibility="gone" />
                      </RelativeLayout>

                      <RelativeLayout
                          android:id="@+id/rltslidshow"''',
              pt_txt,
              count=1,
              flags=re.S
          )

          assert orig_pt_ids.issubset(ids_of(pt_txt)), f"Missing PublicTable IDs: {orig_pt_ids - ids_of(pt_txt)}"
          write_file(pt_path, pt_txt)

          # ------------------------------------------------------------------
          # 7. Patch Java Table Classes & Funtions.java Safely
          # ------------------------------------------------------------------
          funtions_path = os.path.join(java_root, 'Utils/Funtions.java')
          with open(funtions_path, 'r', encoding='utf-8', errors='replace') as f:
              ftxt = f.read()
          if 'BitmapFactory.decodeResource' in ftxt:
              ftxt = re.sub(
                  r'Bitmap bmp = Bitmap\.createScaledBitmap\(BitmapFactory\.decodeResource\(\s*context\.getResources\(\),drawable\),size\.x,size\.y,true\);',
                  '''Bitmap decoded = BitmapFactory.decodeResource(context.getResources(), drawable);
                  if (decoded == null) {
                      if (relativeLayout != null) relativeLayout.setBackgroundResource(drawable);
                      return;
                  }
                  Bitmap bmp = Bitmap.createScaledBitmap(decoded, size.x, size.y, true);''',
                  ftxt
              )
              with open(funtions_path, 'w', encoding='utf-8') as f:
                  f.write(ftxt)

          for tp_rel in [
              '_TeenPatti/PublicTable.java',
              '_TeenPatti/PrivateTablev2.java',
              '_TeenPatti/CustomsiedTablev3.java',
              '_TeenPatti/PublicTable_New.java',
          ]:
              tp_path = os.path.join(java_root, tp_rel)
              if os.path.exists(tp_path):
                  with open(tp_path, 'r', encoding='utf-8', errors='replace') as f:
                      jtxt = f.read()
                  jtxt = jtxt.replace('R.drawable.casino_table_backdrop', 'R.drawable.bgnew1')
                  target_table = 'R.drawable.table_v5' if 'PublicTable_New' in tp_rel else 'R.drawable.table_v4'
                  jtxt = jtxt.replace(
                      'imgTable.setImageResource(R.drawable.casino_emerald_table);',
                      f'Glide.with(this).load({target_table}).into(imgTable);'
                  )
                  with open(tp_path, 'w', encoding='utf-8') as f:
                      f.write(jtxt)

          # ------------------------------------------------------------------
          # 8. Validate All XML Files & Resource References Before Commit
          # ------------------------------------------------------------------
          for root_d, _, files in os.walk(res_dir):
              for fn in files:
                  if fn.endswith('.xml'):
                      ET.parse(os.path.join(root_d, fn))
          print("All XML files parsed cleanly with zero syntax errors!")
          PYEOF

      - name: Commit & Push Backend Fix and Redesigned UI to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Repo already up to date."
          else
            git commit -m "Fix Teen Patti ghost-turn freeze, restore 3D table & upgrade casino lobby posters"
            git push origin HEAD:main || git push origin HEAD:master
          fi

      - name: Setup Java JDK 17 (Required by Android SDK cmdline-tools 16.0)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK Platform 29 & Generate Gradle Wrapper
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name "sdkmanager" | sort -V | tail -n 1)
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-29" "build-tools;29.0.2" "platform-tools"
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 6.1.1
          fi
          chmod +x ./gradlew

      - name: Switch to Java JDK 8 (Required for Gradle 6.1.1 & AGP 4.0.1)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Configure Railway URL, strings.xml & Gradle Repositories
        working-directory: ${{ steps.locate.outputs.dir }}
        env:
          LIVE_URL: ${{ github.event.inputs.railway_url || 'https://allinone-v3-game-production.up.railway.app/' }}
          APP_TITLE: ${{ github.event.inputs.app_name || 'AllInOne V3 Game' }}
        run: |
          python3 - << 'PYEOF'
          import os, re
          live_url = os.environ.get('LIVE_URL', '').strip()
          if not live_url.endswith('/'):
              live_url += '/'
          app_title = os.environ.get('APP_TITLE', 'AllInOne V3 Game').strip()

          const_path = 'app/src/main/java/com/gamegards/allinonev3/SampleClasses/Const.java'
          with open(const_path, 'r', encoding='utf-8', errors='replace') as f:
              const_txt = f.read()
          const_txt = re.sub(r'(?m)^.*public\s+static\s+final\s+String\s+MAIN\s*=.*\r?\n?', '', const_txt)
          const_txt = const_txt.replace(
              'public class Const {',
              'public class Const {\n    public static final String MAIN = "' + live_url + '";\n',
              1
          )
          with open(const_path, 'w', encoding='utf-8') as f:
              f.write(const_txt)

          strings_path = 'app/src/main/res/values/strings.xml'
          with open(strings_path, 'r', encoding='utf-8', errors='replace') as f:
              s_txt = f.read()
          s_txt = s_txt.replace('</string>removeLastChars', '</string>')
          s_txt = re.sub(r'<string name="app_name">.*?</string>', '<string name="app_name">' + app_title + '</string>', s_txt)
          with open(strings_path, 'w', encoding='utf-8') as f:
              f.write(s_txt)

          manifest_path = 'app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r', encoding='utf-8', errors='replace') as f:
              m_txt = f.read()
          if 'usesCleartextTraffic' not in m_txt:
              m_txt = m_txt.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          with open(manifest_path, 'w', encoding='utf-8') as f:
              f.write(m_txt)

          app_gradle_path = 'app/build.gradle'
          with open(app_gradle_path, 'r', encoding='utf-8', errors='replace') as f:
              g_txt = f.read()
          g_txt = re.sub(r'maven\s*\{\s*url\s*"https://mint\.splunk\.com/gradle/"\s*\}', '', g_txt)
          g_txt = re.sub(r'.*com\.splunk\.mint:mint.*\r?\n?', '', g_txt)
          if 'maven.aliyun.com/repository/jcenter' not in g_txt:
              g_txt = g_txt.replace('jcenter()', 'mavenCentral()\n        maven { url "https://maven.aliyun.com/repository/jcenter" }')
          if 'lintOptions' not in g_txt:
              g_txt = g_txt.replace('android {', 'android {\n    lintOptions {\n        checkReleaseBuilds false\n        abortOnError false\n    }\n', 1)
          with open(app_gradle_path, 'w', encoding='utf-8') as f:
              f.write(g_txt)

          for root_j, _, files_j in os.walk('app/src/main/java'):
              for fname_j in files_j:
                  if fname_j.endswith('.java'):
                      fpath_j = os.path.join(root_j, fname_j)
                      with open(fpath_j, 'r', encoding='utf-8', errors='replace') as f:
                          jtxt = f.read()
                      if 'splunk.mint' in jtxt or 'Mint.' in jtxt:
                          jtxt = re.sub(r'(?m)^.*com\.splunk\.mint.*\r?\n?', '', jtxt)
                          jtxt = re.sub(r'(?m)^.*\bMint\.[A-Za-z0-9_]+\(.*?\);\s*\r?\n?', '', jtxt)
                          with open(fpath_j, 'w', encoding='utf-8') as f:
                              f.write(jtxt)
          PYEOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
                  jcenter()
                  maven { url "https://maven.aliyun.com/repository/jcenter" }
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:4.0.1'
                  classpath 'com.google.gms:google-services:4.3.3'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  jcenter()
                  maven { url "https://jitpack.io" }
                  maven { url "https://maven.aliyun.com/repository/jcenter" }
              }
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF

      - name: Generate Release Keystore & Sign APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          if [ ! -f app/release-key.jks ]; then
            keytool -genkey -v \
              -keystore app/release-key.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias allinone \
              -storepass "allinone2026" \
              -keypass "allinone2026" \
              -dname "CN=AllInOneV3, OU=Mobile, O=GameGards, L=Mumbai, S=MH, C=IN"
          fi

      - name: Build Debug & Signed Release APK with Gradle
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name "zipalign" | sort -V | tail -n 1)
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$UNSIGNED_APK" ] && [ -n "$APKSIGNER" ]; then
            "$ZIPALIGN" -v -p 4 "$UNSIGNED_APK" app/build/outputs/apk/release/allinonev3-aligned.apk
            "$APKSIGNER" sign --ks app/release-key.jks --ks-key-alias allinone --ks-pass pass:allinone2026 --key-pass pass:allinone2026 --out app/build/outputs/apk/release/allinonev3-signed-release.apk app/build/outputs/apk/release/allinonev3-aligned.apk
          fi

      - name: Upload Redesigned Ready-to-Install APKs
        uses: actions/upload-artifact@v4
        with:
          name: allinone-v3-redesigned-ui-apk
          path: |
            ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/*.apk
            ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/release/*.apk
          retention-days: 30
